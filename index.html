<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgendApp</title>
  <meta name="description" content="AgendApp — agenda personale: appuntamenti, scadenze, pagamenti, compleanni, mezzi e promemoria a schermo intero.">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AgendApp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/logo.svg" alt="" class="brand-logo" width="34" height="34">
      <div class="brand-text">
        <span class="brand-name">Agend<em>App</em></span>
        <span class="brand-date" id="brand-date"></span>
      </div>
    </div>
    <div class="top-actions" data-update-slot>
      <span data-ponte-slot></span>
      <button class="icon-btn" data-act="search-open" aria-label="Cerca" id="btn-search"></button>
      <button class="icon-btn bell" data-act="notif-center" aria-label="Notifiche" id="btn-bell"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Sezioni principali"></nav>

  <div id="sheets"></div>
  <div id="banners" aria-live="polite"></div>
  <div id="alert-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/ponte.js"></script>
  <script src="js/app.js"></script>
  <script src="js/aggiornamenti.js" data-version="2.0.0"></script>
</body>
</html>
